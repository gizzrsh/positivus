<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus - Main</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="header__inner container">
            <a href="/" class="header__logo">
                <img src="/assets/images/logo.svg" alt="Positivus Logo" width="220" height="56" loading="lazy">
            </a>
            <nav class="header__menu">
                <ul class="header__menu-list">
                    <li class="header__menu-item">
                        <a href="/" class="header__menu-link">About us</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="/" class="header__menu-link">Services</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="/" class="header__menu-link">Use Cases</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="/" class="header__menu-link">Pricing</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="/" class="header__menu-link">Blog</a>
                    </li>
                </ul>
            </nav>
            <div class="header__actions">
                <button type="button" class="button button--outline header__button">Request a quote</button>
                <button type="button" class="header__burger">
                    <span class="header__burger-line"></span>
                    <span class="header__burger-line"></span>
                    <span class="header__burger-line"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Главная верстка -->
    <main class="main">
        <div class="container">
            <!-- Секция hero -->
            <section class="hero">
                <div class="hero__inner">
                    <div class="hero__content">
                        <h1 class="hero__title">
                            Navigating the digital landscape for success
                        </h1>
                        <p class="hero__desc">
                            Our digital marketing agency helps businesses grow and succeed online through a range of services including SEO, PPC, social media marketing, and content creation.
                        </p>
                        <button class="button button--primary hero__button">Book a consultation</button>
                    </div>
                    <img class="hero__image"
                        src="/assets/images/hero/hero-image.svg"
                        alt="Изображение главного блока"
                        width="600"
                        height="515"
                        loading="lazy"
                    >
                </div>
                <ul class="hero__logotypes">
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/amazon.svg" 
                            alt="amazon" 
                            width="124" 
                            height="48">
                    </li>
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/dribbble.svg" 
                            alt="dribbble" 
                            width="126" 
                            height="48">
                    </li>
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/hubspot.svg" 
                            alt="hubspot"
                            width="128"
                            height="48">
                    </li>
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/notion.svg" 
                            alt="notion"
                            width="145"
                            height="48">
                    </li>
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/netflix.svg" 
                            alt="netflix"
                            width="125"
                            height="48">
                    </li>
                    <li class="hero__logotype">
                        <img src="./assets/images/hero/zoom.svg" 
                            alt="zoom"
                            width="110"
                            height="48">
                    </li>
                </ul>
            </section>
            
            <!-- Секция services -->
        </div>
    </main>

    <script type="module" src="/js/script.js"></script>
</body>
</html>
